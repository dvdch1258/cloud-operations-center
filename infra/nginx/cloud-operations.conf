# ==========================================================
# CLOUD OPERATIONS CENTER - HOST GATEWAY
# Ubuntu / NetBird -> kind Ingress NGINX
# ==========================================================


# ----------------------------------------------------------
# FRONTEND + API
# http://HOST:5173
# ----------------------------------------------------------

server {
    listen 5173;
    server_name _;

    # React frontend
    location / {
        proxy_pass http://172.22.0.2:30556;

        proxy_set_header Host frontend.cloud-ops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React usa /api como base.
    # Eliminamos /api antes de enviarlo al Backend.
    location /api/ {
        proxy_pass http://172.22.0.2:30556/;

        proxy_set_header Host cloud-ops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ----------------------------------------------------------
# BACKEND DIRECTO
# http://HOST:8001
# ----------------------------------------------------------

server {
    listen 8001;
    server_name _;

    location / {
        proxy_pass http://172.22.0.2:30556;

        proxy_set_header Host cloud-ops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ----------------------------------------------------------
# GRAFANA
# http://HOST:3001
# ----------------------------------------------------------

server {
    listen 3001;
    server_name _;

    location / {
        proxy_pass http://172.22.0.2:30556;

        proxy_http_version 1.1;

        proxy_set_header Host grafana.cloud-ops.local;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# ----------------------------------------------------------
# PROMETHEUS
# http://HOST:9002
# ----------------------------------------------------------

server {
    listen 9002;
    server_name _;

    location / {
        proxy_pass http://172.22.0.2:30556;

        proxy_set_header Host prometheus.cloud-ops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------
# ARGOCD
# ----------------------------------------------------------
server {
    listen 8085;
    server_name _;

    location / {
        proxy_pass http://172.22.0.2:30556;

        proxy_http_version 1.1;

        proxy_set_header Host argocd.cloud-ops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
