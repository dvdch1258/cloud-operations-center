services:
  backend:
    build: ./backend
    container_name: coc-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - tempo
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-coc_user}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coc_db}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"

  postgres:
    image: postgres:16
    container_name: coc-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-coc_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-coc_db}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tempo:
    image: grafana/tempo:2.6.1
    container_name: coc-tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4317:4317"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: coc-grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: coc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.2.1
    container_name: coc-loki
    command:
      - "-config.file=/etc/loki/loki.yaml"
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro

  promtail:
    image: grafana/promtail:3.2.1
    container_name: coc-promtail
    command:
      - "-config.file=/etc/promtail/promtail.yaml"
    volumes:
      - ./observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  traffic-generator:
    build: ./traffic-generator
    container_name: coc-traffic-generator
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
