services:
  backend:
    build: ./backend
    container_name: coc-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - tempo
    environment:
      DATABASE_URL: postgresql://coc_user:REDACTED_PASSWORD@postgres:5432/coc_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317

  postgres:
    image: postgres:16
    container_name: coc-postgres
    environment:
      POSTGRES_USER: coc_user
      POSTGRES_PASSWORD: REDACTED_PASSWORD
      POSTGRES_DB: coc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tempo:
    image: grafana/tempo:2.6.1
    container_name: coc-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: coc-grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo

volumes:
  postgres_data:
