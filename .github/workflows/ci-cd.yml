name: Cloud Operations CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-operations-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-operations-frontend

jobs:

  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m compileall backend

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/cloud-operations-center-pytest.db
          JWT_SECRET_KEY: github-actions-test-secret-at-least-32-bytes-at-least-32-bytes
          SERVICE_CHECKER_API_KEY: github-actions-checker-key
          N8N_API_KEY: github-actions-n8n-key
          ENVIRONMENT: test
          OTEL_SDK_DISABLED: "true"
        run: |
          pytest -q


  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest

    needs:
      - backend-validation
      - frontend-validation

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: version
        shell: bash
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            APP_VERSION=1.0.1
            BUILD_SHA=${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=/api
            VITE_APP_VERSION=1.0.1
            VITE_BUILD_SHA=${{ github.sha }}
            APP_VERSION=1.0.1
            BUILD_SHA=${{ github.sha }}


  security-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Generate image tag
        id: version
        shell: bash
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Scanning tag: $TAG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          scanners: vuln
          format: json
          output: trivy-backend.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
          scanners: vuln
          format: json
          output: trivy-frontend.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-backend.json
            trivy-frontend.json
          if-no-files-found: warn
          retention-days: 14


  update-gitops:
    name: Update GitOps manifests
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate image tag
        id: version
        shell: bash
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Update Kubernetes image references
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()

          backend_image = f"ghcr.io/{owner}/cloud-operations-backend"
          frontend_image = f"ghcr.io/{owner}/cloud-operations-frontend"

          targets = [
              (
                  Path("k8s/base/backend/deployment.yaml"),
                  backend_image,
              ),
              (
                  Path("k8s/base/backend/migration-job.yaml"),
                  backend_image,
              ),
              (
                  Path("k8s/base/frontend/deployment.yaml"),
                  frontend_image,
              ),
          ]

          for path, image in targets:
              text = path.read_text()

              pattern = rf'(^\s*image:\s*){re.escape(image)}:[^\s]+'
              replacement = rf'\g<1>{image}:{tag}'

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  flags=re.MULTILINE,
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: expected exactly one image in {path}, found {count}"
                  )

              path.write_text(updated)
              print(f"UPDATED {path}: {image}:{tag}")
          PY

      - name: Show GitOps changes
        run: |
          git diff --check
          git diff

      - name: Commit GitOps deployment
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/base/backend/deployment.yaml \
            k8s/base/backend/migration-job.yaml \
            k8s/base/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes required."
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${IMAGE_TAG}"

          git push origin HEAD:main

  publish-vulnerability-reports:
    name: Publish vulnerability reports
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - security-scan
      - update-gitops

    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    env:
      VULNERABILITY_INGEST_URL: https://api.cloudopscenter.es/internal/security/vulnerabilities/import
      VULNERABILITY_INGEST_API_KEY: ${{ secrets.VULNERABILITY_INGEST_API_KEY }}

    steps:
      - name: Download vulnerability reports
        uses: actions/download-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports

      - name: Validate ingest configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$VULNERABILITY_INGEST_API_KEY" ]; then
            echo "::error::VULNERABILITY_INGEST_API_KEY is not configured"
            exit 1
          fi

          test -s trivy-reports/trivy-backend.json
          test -s trivy-reports/trivy-frontend.json

      - name: Publish vulnerability reports
        shell: bash
        run: |
          set -euo pipefail

          publish_report() {
            local component="$1"
            local report="$2"
            local response_file
            local status

            response_file="$(mktemp)"

            for attempt in $(seq 1 30); do
              echo
              echo "Publishing ${component} report (attempt ${attempt}/30)..."

              status="$(
                curl -sS \
                  -o "$response_file" \
                  -w '%{http_code}' \
                  --connect-timeout 10 \
                  --max-time 20 \
                  -X POST \
                  -H 'Content-Type: application/json' \
                  -H "X-Vulnerability-Ingest-Key: ${VULNERABILITY_INGEST_API_KEY}" \
                  --data-binary "@${report}" \
                  "${VULNERABILITY_INGEST_URL}/${component}" \
                  || true
              )"

              case "$status" in
                200|201)
                  echo "Published ${component} report successfully."
                  cat "$response_file"
                  echo
                  rm -f "$response_file"
                  return 0
                  ;;

                401|403)
                  echo "::error::Authentication failed while publishing ${component}"
                  cat "$response_file"
                  echo
                  rm -f "$response_file"
                  return 1
                  ;;

                422)
                  echo "::error::Backend rejected ${component} report"
                  cat "$response_file"
                  echo
                  rm -f "$response_file"
                  return 1
                  ;;

                *)
                  echo "Backend not ready yet (HTTP ${status:-000})."
                  cat "$response_file" || true
                  echo
                  ;;
              esac

              if [ "$attempt" -lt 30 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            done

            echo "::error::Unable to publish ${component} report after 30 attempts"
            rm -f "$response_file"
            return 1
          }

          publish_report \
            backend \
            trivy-reports/trivy-backend.json

          publish_report \
            frontend \
            trivy-reports/trivy-frontend.json
