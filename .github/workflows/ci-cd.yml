name: Cloud Operations CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-operations-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-operations-frontend

jobs:

  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m compileall backend


  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest

    needs:
      - backend-validation
      - frontend-validation

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: version
        shell: bash
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest


  update-gitops:
    name: Update GitOps manifests
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate image tag
        id: version
        shell: bash
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Update Kubernetes image references
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()

          backend_image = f"ghcr.io/{owner}/cloud-operations-backend"
          frontend_image = f"ghcr.io/{owner}/cloud-operations-frontend"

          targets = [
              (
                  Path("k8s/base/backend/deployment.yaml"),
                  backend_image,
              ),
              (
                  Path("k8s/base/backend/migration-job.yaml"),
                  backend_image,
              ),
              (
                  Path("k8s/base/frontend/deployment.yaml"),
                  frontend_image,
              ),
          ]

          for path, image in targets:
              text = path.read_text()

              pattern = rf'(^\s*image:\s*){re.escape(image)}:[^\s]+'
              replacement = rf'\g<1>{image}:{tag}'

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  flags=re.MULTILINE,
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: expected exactly one image in {path}, found {count}"
                  )

              path.write_text(updated)
              print(f"UPDATED {path}: {image}:{tag}")
          PY

      - name: Show GitOps changes
        run: |
          git diff --check
          git diff

      - name: Commit GitOps deployment
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/base/backend/deployment.yaml \
            k8s/base/backend/migration-job.yaml \
            k8s/base/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes required."
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${IMAGE_TAG}"

          git push origin HEAD:main
