apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.33.1
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager

          ports:
            - name: http
              containerPort: 9093

          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true

            - name: data
              mountPath: /alertmanager

      volumes:
        - name: config
          configMap:
            name: alertmanager-config

        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring

spec:
  selector:
    app: alertmanager

  ports:
    - name: http
      port: 9093
      targetPort: http

  type: ClusterIP
