            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "PostgreSQL disponible",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"cloud-ops\",deployment=\"postgres\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "CAÍDO"
                    },
                    "1": {
                      "text": "OPERATIVO"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 1
