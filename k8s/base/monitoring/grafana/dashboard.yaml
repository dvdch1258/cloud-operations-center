apiVersion: v1
data:
  cloud-operations.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Backend disponible",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"cloud-ops\",deployment=\"backend\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "CAÍDO"
                    },
                    "1": {
                      "text": "OPERATIVO"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "PostgreSQL disponible",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"cloud-ops\",deployment=\"postgres\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "CAÍDO"
                    },
                    "1": {
                      "text": "OPERATIVO"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Pods Pending",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{namespace=~\"cloud-ops|monitoring\",phase=\"Pending\"} == 1) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Alertas activas",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ALERTS{alertstate=\"firing\"}) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "HPA: réplicas actuales",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"cloud-ops\",horizontalpodautoscaler=\"backend\"}",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "HPA: máximo",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"cloud-ops\",horizontalpodautoscaler=\"backend\"}",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Reinicios de contenedores",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_pod_container_status_restarts_total{namespace=~\"cloud-ops|monitoring\"}",
              "legendFormat": "{{namespace}} / {{pod}} / {{container}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          }
        },
        {
          "type": "timeseries",
          "title": "Réplicas del backend",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"cloud-ops\",horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "Actuales"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"cloud-ops\",horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "Deseadas"
            },
            {
              "refId": "C",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"cloud-ops\",horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "Máximo"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          }
        },
        {
          "type": "timeseries",
          "title": "CPU del proceso FastAPI",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(process_cpu_seconds_total{job=\"backend\"}[5m])",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          }
        },
        {
          "type": "timeseries",
          "title": "Memoria del proceso FastAPI",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{job=\"backend\"}",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          }
        },
        {
          "type": "table",
          "title": "Targets de Prometheus",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "renameByName": {
                  "Value": "Estado",
                  "instance": "Instancia",
                  "job": "Trabajo"
                }
              }
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          }
        },
        {
          "type": "table",
          "title": "Alertas de Prometheus",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ALERTS{alertstate=~\"pending|firing\"}",
              "instant": true,
              "format": "table"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Incidencias abiertas",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(coc_incidents_open{job=\"backend\"}) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 29
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Tasa de errores HTTP 5xx",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{job=\"backend\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{job=\"backend\"}[5m])), 0.001)) * 100",
              "legendFormat": "Errores 5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 29
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Latencia p95 del backend",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"backend\"}[5m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 29
          }
        },
        {
          "id": 16,
          "type": "logs",
          "title": "Logs del backend",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"cloud-ops\",container=\"backend\"}",
              "queryType": "range",
              "direction": "backward",
              "editorMode": "code"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 37
          }
        }
      ],
      "refresh": "15s",
      "schemaVersion": 41,
      "tags": [
        "kubernetes",
        "prometheus",
        "cloud-operations"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Cloud Operations Center",
      "uid": "cloud-operations-center",
      "version": 3
    }
kind: ConfigMap
metadata:
  name: grafana-cloud-operations-dashboard
  namespace: monitoring
