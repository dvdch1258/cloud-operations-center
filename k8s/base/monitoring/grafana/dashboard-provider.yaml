apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: cloud-operations
        orgId: 1
        folder: Cloud Operations
        folderUid: cloud-operations
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true

        options:
          path: /var/lib/grafana/dashboards/cloud-operations
