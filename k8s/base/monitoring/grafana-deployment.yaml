apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy: {}
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - env:
        - name: GF_SECURITY_CSRF_TRUSTED_ORIGINS
          value: https://grafana.cloudopscenter.es
        - name: GF_SECURITY_CSRF_ADDITIONAL_HEADERS
          value: X-Forwarded-Host
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.cloudopscenter.es/
        image: grafana/grafana:11.3.0
        name: grafana
        ports:
        - containerPort: 3000
        resources: {}
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-storage
        - mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          name: grafana-datasource
          readOnly: true
          subPath: datasources.yaml
        - mountPath: /etc/grafana/provisioning/dashboards
          name: grafana-dashboard-provider
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards/cloud-operations
          name: grafana-dashboards
          readOnly: true
      securityContext:
        fsGroup: 472
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - configMap:
          name: grafana-datasource
        name: grafana-datasource
      - configMap:
          name: grafana-dashboard-provider
        name: grafana-dashboard-provider
      - configMap:
          name: grafana-cloud-operations-dashboard
        name: grafana-dashboards
status: {}
