apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring

data:
  cloud-operations-alerts.yml: |
    groups:
      - name: cloud-operations
        rules:
          - alert: PodPendingTooLong
            expr: |
              kube_pod_status_phase{
                namespace=~"cloud-ops|monitoring",
                phase="Pending"
              } == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod bloqueado en Pending"
              description: "El pod {{ $labels.namespace }}/{{ $labels.pod }} lleva más de 2 minutos en estado Pending."

          - alert: ContainerRestarting
            expr: |
              increase(
                kube_pod_container_status_restarts_total{
                  namespace=~"cloud-ops|monitoring",
                  container!="POD"
                }[15m]
              ) >= 3
            for: 2m
            labels:
              severity: warning
              category: infrastructure
            annotations:
              summary: "Contenedor con reinicios frecuentes"
              description: "El contenedor {{ $labels.container }} del pod {{ $labels.namespace }}/{{ $labels.pod }} se ha reiniciado al menos 3 veces durante los últimos 15 minutos."

          - alert: BackendUnavailable
            expr: |
              kube_deployment_status_replicas_available{
                namespace="cloud-ops",
                deployment="backend"
              } < 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend no disponible"
              description: "El deployment backend no tiene ninguna réplica disponible."

          - alert: PostgreSQLUnavailable
            expr: |
              kube_deployment_status_replicas_available{
                namespace="cloud-ops",
                deployment="postgres"
              } < 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL no disponible"
              description: "El deployment postgres no tiene ninguna réplica disponible."

          - alert: BackendHPAAtMaximum
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas{
                namespace="cloud-ops",
                horizontalpodautoscaler="backend"
              }
              >=
              kube_horizontalpodautoscaler_spec_max_replicas{
                namespace="cloud-ops",
                horizontalpodautoscaler="backend"
              }
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPA del backend en su máximo"
              description: "El backend lleva más de 5 minutos utilizando el máximo de réplicas permitido."

          - alert: BackendTargetDown
            expr: |
              up{job="backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus no puede consultar el backend"
              description: "El target del backend lleva más de 1 minuto sin responder a Prometheus."

          - alert: KubeStateMetricsDown
            expr: |
              up{job="kube-state-metrics"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "kube-state-metrics no disponible"
              description: "Prometheus no puede obtener métricas del estado de Kubernetes."

          - alert: BackendHighErrorRate
            expr: |
              (
                sum(
                  rate(
                    http_requests_total{
                      job="backend",
                      status=~"5.."
                    }[5m]
                  )
                )
                /
                clamp_min(
                  sum(
                    rate(
                      http_requests_total{
                        job="backend"
                      }[5m]
                    )
                  ),
                  0.001
                )
              ) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Tasa elevada de errores HTTP 5xx"
              description: "Más del 5 % de las peticiones del backend están terminando con errores 5xx durante al menos 2 minutos."

          - alert: BackendHighLatency
            expr: |
              (
                histogram_quantile(
                  0.95,
                  sum by (le, handler, method) (
                    rate(
                      http_request_duration_seconds_bucket{
                        job="backend",
                        handler!~"/health|/metrics|/services/check-all|none"
                      }[5m]
                    )
                  )
                ) > 0.75
              )
              and on (handler, method)
              (
                sum by (handler, method) (
                  rate(
                    http_requests_total{
                      job="backend",
                      handler!~"/health|/metrics|/services/check-all|none"
                    }[5m]
                  )
                ) > 0.02
              )
            for: 5m
            labels:
              severity: warning
              category: application
            annotations:
              summary: "Latencia elevada en el backend"
              description: "La ruta {{ $labels.handler }} con método {{ $labels.method }} mantiene una latencia p95 superior a 750 ms con tráfico suficiente durante al menos 5 minutos."

          - alert: TooManyOpenIncidents
            expr: |
              coc_incidents_open{job="backend"} >= 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Demasiadas incidencias abiertas"
              description: "Hay {{ printf \"%.0f\" $value }} incidencias abiertas durante al menos 5 minutos."
