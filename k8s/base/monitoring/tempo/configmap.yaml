apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring

data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: cloud-ops

      storage:
        path: /data/tempo/generator/wal
        remote_write:
          - url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            send_exemplars: true

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics

    storage:
      trace:
        backend: local
        wal:
          path: /data/tempo/wal
        local:
          path: /data/tempo/blocks

    usage_report:
      reporting_enabled: false
