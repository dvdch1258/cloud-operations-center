apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: backend
        static_configs:
          - targets:
              - backend.cloud-ops.svc.cluster.local:8000
            labels:
              namespace: cloud-ops

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.kube-system.svc.cluster.local:8080

      - job_name: alertmanager
        static_configs:
          - targets:
              - alertmanager.monitoring.svc.cluster.local:9093
