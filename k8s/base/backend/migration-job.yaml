apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrations
  namespace: cloud-ops
  labels:
    app: backend
    component: migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: backend
        component: migrations
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrations
          image: ghcr.io/dvdch1258/cloud-operations-backend:sha-782cc0b
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - -c
            - /app/alembic.ini
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
