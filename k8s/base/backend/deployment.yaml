apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloud-ops

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/dvdch1258/cloud-operations-backend:sha-5e7c928
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "production"

            # Uvicorn acepta X-Forwarded-* únicamente desde
            # la red interna de pods donde vive ingress-nginx.
            - name: FORWARDED_ALLOW_IPS
              value: "10.42.0.0/16"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-auth-secret
                  key: JWT_SECRET_KEY

            - name: SERVICE_CHECKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: service-checker-secret
                  key: SERVICE_CHECKER_API_KEY

            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-backend-secret
                  key: N8N_API_KEY

          envFrom:
            - configMapRef:
                name: backend-config

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
