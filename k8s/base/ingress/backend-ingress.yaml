apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: cloud-ops
spec:
  ingressClassName: nginx
  rules:
  - host: api.cloudopscenter.es
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
  - host: cloud-ops.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
  tls:
  - hosts:
    - api.cloudopscenter.es
    secretName: cloudopscenter-api-tls
